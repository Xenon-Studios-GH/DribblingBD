<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-soft-accent flex items-center justify-center"><span class="text-lg font-bold text-white">D</span></div><span class="text-xl font-bold">DRIDDLING<span class="text-accent">BD</span></span></a>
        <a href="index.html" class="text-secondary">← Back to Home</a>
      </div>
    </div>
  </nav>

  <section class="min-h-screen pt-16">
    <div class="auth-container">
      <div class="auth-visual relative">
        <div class="p-12 text-center text-white">
          <h2 class="text-4xl font-bold mb-4">WELCOME TO DRIDDLINGBD</h2>
          <p class="opacity-80">Join thousands of satisfied customers</p>
        </div>
      </div>

      <div class="auth-form-section">
        <div class="w-full max-w-md">
          <div class="flex mb-8 border-b border-border-color">
            <button class="tab-btn active flex-1 pb-3 text-center font-semibold" data-tab="login">Login</button>
            <button class="tab-btn flex-1 pb-3 text-center font-semibold" data-tab="register">Register</button>
          </div>

          <div class="tab-content active" id="login">
            <form class="space-y-5">
              <div><label class="block text-secondary text-sm mb-2">Email</label><input type="email" class="input-field" placeholder="your@email.com" required></div>
              <div><label class="block text-secondary text-sm mb-2">Password</label><input type="password" class="input-field" placeholder="••••••••" required></div>
              <div class="flex justify-between items-center"><label class="flex items-center gap-2 text-secondary text-sm"><input type="checkbox" class="w-4 h-4 rounded">Remember me</label><a href="#" class="text-accent text-sm">Forgot Password?</a></div>
              <button type="submit" class="btn-primary w-full justify-center">Login</button>
            </form>
          </div>

          <div class="tab-content hidden" id="register">
            <form class="space-y-5">
              <div class="grid grid-cols-2 gap-4"><input type="text" class="input-field" placeholder="First Name" required><input type="text" class="input-field" placeholder="Last Name" required></div>
              <div><label class="block text-secondary text-sm mb-2">Email</label><input type="email" class="input-field" required></div>
              <div><label class="block text-secondary text-sm mb-2">Password</label><input type="password" class="input-field" placeholder="Min. 8 characters" required></div>
              <label class="flex items-start gap-2 text-secondary text-sm"><input type="checkbox" class="w-4 h-4 mt-0.5 rounded" required>I agree to the <a href="#" class="text-accent">Terms</a></label>
              <button type="submit" class="btn-primary w-full justify-center">Create Account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
