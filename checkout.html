<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-soft-accent flex items-center justify-center"><span class="text-lg font-bold text-white">D</span></div><span class="text-xl font-bold">DRIDDLING<span class="text-accent">BD</span></span></a>
      </div>
    </div>
  </nav>

  <section class="pt-24 pb-8">
    <div class="container mx-auto px-6">
      <h1 class="text-3xl font-bold text-center mb-8">SECURE <span class="gradient-text">CHECKOUT</span></h1>
      
      <form class="checkout-form">
        <div class="grid lg:grid-cols-3 gap-12">
          <div class="lg:col-span-2 space-y-6">
            <div class="card p-6">
              <h3 class="font-semibold text-lg mb-4">Billing Information</h3>
              <div class="grid md:grid-cols-2 gap-4">
                <input type="text" class="input-field" placeholder="First Name *" required>
                <input type="text" class="input-field" placeholder="Last Name *" required>
              </div>
              <div class="mt-4"><input type="email" class="input-field" placeholder="Email Address *" required></div>
              <div class="mt-4"><input type="tel" class="input-field" placeholder="Phone Number *" required></div>
              <div class="mt-4"><input type="text" class="input-field" placeholder="Address *" required></div>
              <div class="grid md:grid-cols-2 gap-4 mt-4">
                <input type="text" class="input-field" placeholder="City *" required>
                <input type="text" class="input-field" placeholder="Postal Code *" required>
              </div>
            </div>

            <div class="card p-6">
              <h3 class="font-semibold text-lg mb-4">Payment Method</h3>
              <div class="space-y-3">
                <label class="payment-option selected"><input type="radio" name="payment" checked><span class="font-medium">Cash on Delivery</span></label>
                <label class="payment-option"><input type="radio" name="payment"><span class="font-medium">Mobile Banking (bKash, Nagad)</span></label>
                <label class="payment-option"><input type="radio" name="payment"><span class="font-medium">Bank Transfer</span></label>
              </div>
            </div>
          </div>

          <div class="lg:col-span-1">
            <div class="card p-6 sticky-top">
              <h3 class="font-semibold text-lg mb-4">Your Order</h3>
              <div class="space-y-4 mb-6" id="checkout-items"></div>
              <div class="border-t border-border-color pt-4 space-y-2">
                <div class="flex justify-between text-secondary"><span>Subtotal</span><span class="cart-subtotal">₹0</span></div>
                <div class="flex justify-between text-secondary"><span>Shipping</span><span class="text-accent">Free</span></div>
                <div class="flex justify-between font-bold text-lg pt-2"><span>Total</span><span class="cart-total text-accent">₹0</span></div>
              </div>
              <button type="submit" class="btn-primary w-full justify-center mt-6">Place Order</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </section>

  <footer class="footer mt-16">
    <div class="container mx-auto px-6">
      <div class="border-t border-border-color py-6 text-center"><p class="text-secondary text-sm">© 2024 DriddlingBD. All rights reserved.</p></div>
    </div>
  </footer>

  <a href="https://wa.me/8801234567890" class="whatsapp-float">💬</a>

  <script src="assets/js/main.js"></script>
  <script>
    const cart = JSON.parse(localStorage.getItem('driddling_cart')) || [];
    const checkoutItems = document.getElementById('checkout-items');
    if (checkoutItems) {
      checkoutItems.innerHTML = cart.map(item => `
        <div class="flex gap-3">
          <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-lg object-cover">
          <div class="flex-1"><p class="font-medium text-sm">${item.name}</p><p class="text-secondary text-sm">Qty: ${item.quantity}</p></div>
          <p class="font-medium">₹${(item.price * item.quantity).toLocaleString()}</p>
        </div>
      `).join('') || '<p class="text-secondary">Your cart is empty</p>';
    }
  </script>
</body>
</html>
