<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-soft-accent flex items-center justify-center"><span class="text-lg font-bold text-white">D</span></div><span class="text-xl font-bold">DRIDDLING<span class="text-accent">BD</span></span></a>
        <a href="index.html" class="text-secondary">← Back to Shop</a>
      </div>
    </div>
  </nav>

  <section class="pt-24 pb-8">
    <div class="container mx-auto px-6">
      <h1 class="text-3xl font-bold text-center mb-8">SHOPPING <span class="gradient-text">CART</span></h1>
      
      <div class="grid lg:grid-cols-3 gap-12">
        <div class="lg:col-span-2">
          <div class="cart-items-container"></div>
        </div>

        <div class="lg:col-span-1">
          <div class="card p-6 sticky-top">
            <h3 class="font-semibold text-lg mb-4">Order Summary</h3>
            <div class="space-y-3 mb-6">
              <div class="flex justify-between text-secondary"><span>Subtotal</span><span class="cart-subtotal font-medium">₹0</span></div>
              <div class="flex justify-between text-secondary"><span>Shipping</span><span class="text-accent">Free</span></div>
              <div class="border-t border-border-color pt-3 flex justify-between font-bold"><span>Total</span><span class="cart-total text-xl text-accent">₹0</span></div>
            </div>
            <input type="text" class="input-field mb-4" placeholder="Coupon code">
            <a href="checkout.html" class="btn-primary w-full justify-center">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer mt-16">
    <div class="container mx-auto px-6">
      <div class="border-t border-border-color py-6 text-center"><p class="text-secondary text-sm">© 2024 DriddlingBD. All rights reserved.</p></div>
    </div>
  </footer>

  <a href="https://wa.me/8801234567890" class="whatsapp-float">💬</a>

  <script src="assets/js/main.js"></script>
</body>
</html>
