<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-accent-neon to-electric-blue flex items-center justify-center"><span class="text-2xl font-bold text-primary-bg font-display">D</span></div>
          <span class="text-2xl font-bold font-display tracking-wide">DRIDDLING<span class="text-accent-neon">BD</span></span>
        </a>
        <div class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="contact.html" class="nav-link">Contact</a>
        </div>
        <div class="flex items-center gap-4">
          <a href="cart.html" class="p-3 rounded-xl bg-glass border border-accent-neon relative">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span class="cart-count absolute -top-1 -right-1 w-5 h-5 bg-accent-neon text-primary-bg text-xs font-bold rounded-full flex items-center justify-center" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="pt-32 pb-8 bg-secondary">
    <div class="container mx-auto px-6">
      <h1 class="text-5xl font-display text-center">SHOPPING <span class="gradient-text">CART</span></h1>
    </div>
  </section>

  <!-- Cart Section -->
  <section class="section-padding pt-8">
    <div class="container mx-auto px-6">
      <div class="grid lg:grid-cols-3 gap-12">
        <!-- Cart Items -->
        <div class="lg:col-span-2">
          <div class="cart-items-container">
            <!-- Cart items rendered by JS -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="lg:col-span-1">
          <div class="glass-card p-8 sticky top-24">
            <h3 class="text-xl font-semibold mb-6">Order Summary</h3>
            
            <div class="space-y-4 mb-6">
              <div class="flex justify-between">
                <span class="text-gray-400">Subtotal</span>
                <span class="cart-subtotal font-semibold">₹0</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-400">Shipping</span>
                <span class="text-accent-neon">Free</span>
              </div>
              <div class="border-t border-border-color pt-4 flex justify-between">
                <span class="font-semibold">Total</span>
                <span class="cart-total text-2xl font-bold text-accent-neon">₹0</span>
              </div>
            </div>

            <!-- Coupon -->
            <div class="mb-6">
              <div class="flex gap-2">
                <input type="text" class="input-field flex-1" placeholder="Coupon code">
                <button class="btn-secondary">Apply</button>
              </div>
            </div>

            <a href="checkout.html" class="checkout-btn btn-primary w-full justify-center">
              Proceed to Checkout
            </a>

            <div class="mt-6 text-center">
              <p class="text-gray-400 text-sm">🔒 Secure checkout</p>
              <p class="text-gray-500 text-xs mt-2">Free shipping on orders above ₹2,000</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer mt-16">
    <div class="container mx-auto px-6">
      <div class="border-t border-border-color pt-8 pb-8 text-center">
        <p class="text-gray-400 text-sm">© 2024 DriddlingBD. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <a href="https://wa.me/8801234567890" class="whatsapp-float">💬</a>
  <script src="assets/js/main.js"></script>
</body>
</html>
