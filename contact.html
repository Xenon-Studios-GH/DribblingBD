<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-soft-accent flex items-center justify-center"><span class="text-lg font-bold text-white">D</span></div><span class="text-xl font-bold">DRIDDLING<span class="text-accent">BD</span></span></a>
        <div class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="nav-link">Home</a>
          <a href="contact.html" class="nav-link active">Contact</a>
        </div>
        <div class="flex items-center gap-3">
          <a href="cart.html" class="p-2.5 rounded-xl relative"><span class="cart-count absolute -top-1 -right-1 w-5 h-5 bg-accent text-white text-xs font-medium rounded-full flex items-center justify-center">0</span></a>
        </div>
      </div>
    </div>
  </nav>

  <section class="pt-28 pb-12 bg-secondary-bg">
    <div class="container mx-auto px-6">
      <h1 class="text-4xl font-bold text-center">GET IN <span class="gradient-text">TOUCH</span></h1>
    </div>
  </section>

  <section class="section-padding">
    <div class="container mx-auto px-6">
      <div class="grid md:grid-cols-3 gap-6 mb-12">
        <div class="contact-card"><div class="contact-icon">📍</div><h4 class="font-semibold">Visit Us</h4><p class="text-secondary">Dhaka, Bangladesh</p></div>
        <div class="contact-card"><div class="contact-icon">📞</div><h4 class="font-semibold">Call Us</h4><p class="text-secondary">+880 1234 567890</p></div>
        <div class="contact-card"><div class="contact-icon">✉️</div><h4 class="font-semibold">Email Us</h4><p class="text-secondary">info@driddlingbd.com</p></div>
      </div>

      <div class="grid lg:grid-cols-2 gap-12">
        <form class="contact-form space-y-6">
          <div class="grid md:grid-cols-2 gap-4">
            <input type="text" class="input-field" placeholder="Your Name" required>
            <input type="email" class="input-field" placeholder="Your Email" required>
          </div>
          <input type="tel" class="input-field" placeholder="Phone Number">
          <textarea class="input-field" rows="5" placeholder="Your Message" required></textarea>
          <button type="submit" class="btn-primary">Send Message</button>
        </form>
        <div class="card p-8">
          <h3 class="font-semibold text-lg mb-4">Business Hours</h3>
          <p class="text-secondary mb-2">Mon - Fri: 9:00 AM - 8:00 PM</p>
          <p class="text-secondary mb-4">Sat: 10:00 AM - 6:00 PM</p>
          <a href="https://wa.me/8801234567890" class="btn-primary inline-flex">💬 WhatsApp</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container mx-auto px-6">
      <div class="border-t border-border-color py-6 text-center"><p class="text-secondary text-sm">© 2024 DriddlingBD. All rights reserved.</p></div>
    </div>
  </footer>

  <a href="https://wa.me/8801234567890" class="whatsapp-float">💬</a>

  <script src="assets/js/main.js"></script>
</body>
</html>
