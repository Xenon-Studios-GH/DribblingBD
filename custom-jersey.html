<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Jersey | DriddlingBD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-transition">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container mx-auto px-6">
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-soft-accent flex items-center justify-center"><span class="text-lg font-bold text-white">D</span></div>
          <span class="text-xl font-bold">DRIDDLING<span class="text-accent">BD</span></span>
        </a>
        <div class="hidden lg:flex items-center gap-8">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="custom-jersey.html" class="nav-link active">Custom Jersey</a>
          <a href="about.html" class="nav-link">About</a>
          <a href="contact.html" class="nav-link">Contact</a>
        </div>
        <div class="flex items-center gap-3">
          <a href="cart.html" class="p-2.5 rounded-xl relative">
            <span class="cart-count absolute -top-1 -right-1 w-5 h-5 bg-accent text-white text-xs font-medium rounded-full flex items-center justify-center">0</span>
          </a>
          <button class="mobile-menu-btn lg:hidden"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
      </div>
    </div>
  </nav>

  <div class="nav-menu">
    <button class="nav-menu-close">&times;</button>
    <div class="flex flex-col gap-5">
      <a href="index.html" class="nav-link text-lg">Home</a>
      <a href="custom-jersey.html" class="nav-link text-lg active">Custom Jersey</a>
      <a href="contact.html" class="nav-link text-lg">Contact</a>
    </div>
  </div>

  <!-- Page Header -->
  <section class="pt-28 pb-12 bg-secondary-bg">
    <div class="container mx-auto px-6">
      <h1 class="text-4xl font-bold text-center">CUSTOM <span class="gradient-text">JERSEY</span></h1>
      <p class="text-secondary text-center mt-3">Design your own premium custom jersey</p>
    </div>
  </section>

  <!-- Configurator -->
  <section class="section-padding">
    <div class="container mx-auto px-6">
      <div class="grid lg:grid-cols-2 gap-12">
        <!-- Preview -->
        <div class="reveal">
          <div class="configurator-panel">
            <h3 class="font-semibold mb-4 text-center">LIVE PREVIEW</h3>
            <div class="config-preview">
              <div class="text-center">
                <p class="text-6xl font-bold opacity-20">10</p>
                <p class="text-xl mt-2">YOUR NAME</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="reveal" style="transition-delay: 0.2s;">
          <div class="configurator-panel space-y-6">
            <!-- Jersey Type -->
            <div>
              <h4 class="font-semibold mb-3">Jersey Type</h4>
              <div class="grid grid-cols-2 gap-3">
                <button class="filter-btn active p-3 text-center text-sm" data-type="cricket">🏏 Cricket</button>
                <button class="filter-btn p-3 text-center text-sm" data-type="football">⚽ Football</button>
              </div>
            </div>

            <!-- Base Color -->
            <div>
              <h4 class="font-semibold mb-3">Base Color</h4>
              <div class="color-picker-grid">
                <button class="color-swatch selected" style="background-color: #1E3A5F"></button>
                <button class="color-swatch" style="background-color: #2563EB"></button>
                <button class="color-swatch" style="background-color: #EF4444"></button>
                <button class="color-swatch" style="background-color: #10B981"></button>
                <button class="color-swatch" style="background-color: #F59E0B"></button>
                <button class="color-swatch" style="background-color: #7C3AED"></button>
              </div>
            </div>

            <!-- Player Details -->
            <div>
              <h4 class="font-semibold mb-3">Player Details</h4>
              <div class="space-y-3">
                <input type="text" class="input-field" placeholder="Player Name" maxlength="15">
                <input type="text" class="input-field" placeholder="Player Number" maxlength="3">
              </div>
            </div>

            <!-- Quantity -->
            <div>
              <h4 class="font-semibold mb-3">Quantity</h4>
              <div class="flex items-center gap-4">
                <div class="quantity-control">
                  <button class="quantity-btn">−</button>
                  <span class="quantity-value px-3">10</span>
                  <button class="quantity-btn">+</button>
                </div>
                <span class="text-secondary text-sm">Min. order: 10 pieces</span>
              </div>
            </div>

            <button class="btn-primary w-full justify-center" onclick="window.DriddlingBD.showToast('Quote request submitted!', 'success')">
              Get Quote
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container mx-auto px-6">
      <div class="border-t border-border-color py-6 text-center">
        <p class="text-secondary text-sm">© 2024 DriddlingBD. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <a href="https://wa.me/8801234567890" class="whatsapp-float">💬</a>

  <script src="assets/js/main.js"></script>
</body>
</html>
